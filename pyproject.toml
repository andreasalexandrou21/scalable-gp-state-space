[project]
name = "ssgp-experiments"
version = "0.1.0"
description = "Experiments for the thesis: Scalable GP Regression through State-Space Formulations"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# code/ is a flat directory of sibling modules, not an installed package, so name them
# explicitly or isort treats them as third-party and collapses the import groups.
known-first-party = ["config", "data", "dense_gpr", "kalman_rts", "matern_ssm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
